services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: fiberflow-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fiberflow_gis
      POSTGRES_USER: fiberflow
      POSTGRES_PASSWORD: fiberflow
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiberflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
