services:
  app:
    image: ghcr.io/BEN-ESSAHRAOUI-Yassine/fiberflow-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiberflow-app-prod
    restart: unless-stopped
    pull_policy: always
    mem_limit: 768m
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: ghcr.io/BEN-ESSAHRAOUI-Yassine/fiberflow-nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: fiberflow-nginx-prod
    restart: unless-stopped
    pull_policy: always
    mem_limit: 128m
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: fiberflow-mysql-prod
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: fiberflow
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb_buffer_pool_size=512M
      - --performance_schema=OFF
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data_prod: