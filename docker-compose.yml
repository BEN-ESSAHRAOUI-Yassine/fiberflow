services:
  mysql:
    image: mysql:8.0
    container_name: fiberflow-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fiberflow
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    container_name: fiberflow-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    shm_size: 256mb
    environment:
      POSTGRES_DB: fiberflow_gis
      POSTGRES_USER: fiberflow
      POSTGRES_PASSWORD: fiberflow
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docs/Fake_GIS_data:/data/gis:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiberflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fiberflow-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html:delegated
    environment:
      DB_HOST: mysql
      POSTGIS_HOST: postgis
    depends_on:
      mysql:
        condition: service_healthy
      postgis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fiberflow-queue
    restart: unless-stopped
    volumes:
      - .:/var/www/html:delegated
    environment:
      DB_HOST: mysql
      POSTGIS_HOST: postgis
    command: php artisan queue:work --sleep=3 --tries=1 --max-time=3600
    depends_on:
      mysql:
        condition: service_healthy
      postgis:
        condition: service_healthy

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fiberflow-vite
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html:delegated
    working_dir: /var/www/html
    environment:
      VITE_DEV_SERVER_URL: http://127.0.0.1:5173
    command: npx vite
    depends_on:
      - app

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: fiberflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - app

volumes:
  mysql_data:
  postgis_data:
